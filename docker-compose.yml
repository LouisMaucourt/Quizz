services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build: ./back
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./back:/app
      - /app/node_modules
    ports:
      - "4000:4000"

  front:
    build: ./front
    restart: unless-stopped
    depends_on:
      - back
    environment:
      - API_URL=http://back:4000
      - PORT=3000
    env_file: .env
    volumes:
      - ./front:/app
      - /app/node_modules
    ports:
      - "3000:3000"

volumes:
  db_data: